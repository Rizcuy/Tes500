<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Kuis Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white shadow-xl rounded-2xl p-6 md:p-8 border border-slate-100">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 id="header-title" class="text-xl font-bold text-slate-800">Pusat Kuis Interaktif</h1>
                <p id="header-subtitle" class="text-xs text-slate-500 mt-1">Pilih kategori latihan soal yang tersedia</p>
            </div>
            <div id="score-badge" class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-semibold hidden">
                Skor: <span id="current-score">0</span>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="py-2">
            <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl font-bold">🎯</div>
            <h2 class="text-base font-bold text-slate-700 mb-1 text-center">Pilih Kategori Latihan</h2>
            <p class="text-xs text-slate-500 mb-5 text-center">Klik pada kategori untuk membuka daftar materinya.</p>

            <div id="category-container" class="space-y-3 mb-4 max-h-[420px] overflow-y-auto pr-1">
                <!-- Kategori Accordion akan dimuat otomatis di sini -->
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <!-- Navigasi Atas (Tombol Back & Info Progress/Timer) -->
            <div class="flex justify-between items-center mb-4 text-xs font-medium text-slate-400">
                <button onclick="confirmExit()" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition font-semibold shadow-2xs">
                    ← Beranda
                </button>
                <div class="flex items-center gap-2">
                    <span id="question-progress">Soal 1 dari 50</span>
                    <span id="timer" class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded">Waktu: <span id="time-left">30</span>s</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 2%;"></div>
            </div>

            <!-- Question Box -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-6 text-center mb-6 shadow-sm">
                <p id="question-label" class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-2">Terjemahkan</p>
                <h3 id="question-text" class="text-4xl font-bold text-slate-800 my-3">--</h3>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="grid grid-cols-1 gap-3"></div>

            <!-- Next Button -->
            <button id="next-btn" onclick="nextQuestion()" class="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 hidden">
                Soal Selanjutnya
            </button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center py-8">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">🎉</div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Kuis Selesai!</h2>
            <p id="result-user-info" class="text-sm text-slate-500 mb-6">Kerja bagus!</p>
            
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 mb-6">
                <div class="text-4xl font-extrabold text-indigo-600 mb-1"><span id="final-score">0</span></div>
                <p class="text-xs text-slate-500" id="result-message">Pertahankan prestasinya!</p>
            </div>

            <button onclick="backToHome()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-lg shadow-indigo-100">
                Pilih Kuis Lain
            </button>
        </div>

    </div>

    <script>
        // Struktur Kategori dengan Accordion & Sub-kategori Kanji / Kotoba
        const daftarKuis = [
            {
                id: "group-vocab",
                groupTitle: "📖 Kosakata (Tanpa Kanji)",
                description: "Ambil seluruh soal dari file (Tanpa Batasan 50)",
                items: [
                    { title: "Kosakata Bab 1", file: "data/BAB_1.json", mode: "vocab", sampleSize: "all" },
                    { title: "Kosakata Bab 2", file: "data/BAB_2.json", mode: "vocab", sampleSize: "all" },
                    { title: "Kosakata Sd Bab 25", file: "data/vocab_sd_25.json", mode: "vocab", sampleSize: "all" }
                ]
            },
            {
                id: "group-kanji",
                groupTitle: "🇯🇵 Kanji & Kanji Kotoba",
                description: "Default 50 soal acak (Kecuali Kanji Bab diambil semua)",
                items: [
                    { title: "Kanji TG", file: "data/KanjiTG.json", mode: "kanji", sampleSize: 50 },
                    { title: "Kanji Anzen (Keselamatan Kerja)", file: "data/kanji_anzen.json", mode: "kanji", sampleSize: 50 }, 
                    { 
                        title: "Kanji Bab (Bab 1 s.d. 25)", 
                        isSubGroup: true,
                        items: [
                            { title: "Kanji Bab 1", file: "data/BAB_1.json", mode: "kanji", sampleSize: "all" },
                            { title: "Kanji Bab 2", file: "data/BAB_2.json", mode: "kanji", sampleSize: "all" },
                            { title: "Kanji Bab 3", file: "data/BAB_3.json", mode: "kanji", sampleSize: "all" },
                            { title: "Kanji Sd Bab 25", file: "data/kanji_sd_25.json", mode: "kanji", sampleSize: "all" }
                        ]
                    },
                    { 
                        title: "Kanji Kotoba (Kosakata Berkanji)", 
                        isSubGroup: true,
                        items: [
                            { title: "Kanji Kotoba Bab 1", file: "data/kanji_kotoba_1.json", mode: "kanji", sampleSize: "all" },
                            { title: "Kanji Kotoba Bab 2", file: "data/kanji_kotoba_2.json", mode: "kanji", sampleSize: "all" }
                        ]
                    }
                ]
            }
        ];

        let rawVocab = [];
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 30;
        let isAnswered = false;
        let currentCategoryTitle = "";
        let currentMode = "kanji";

        window.onload = function() {
            renderCategories();
        };

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';
            
            daftarKuis.forEach((group, index) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = "bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm";
                
                // Tombol Utama Accordion
                const headerBtn = document.createElement('button');
                headerBtn.className = "w-full p-4 text-left font-bold text-slate-800 text-sm bg-slate-50 hover:bg-indigo-50/50 transition duration-150 flex justify-between items-center";
                headerBtn.innerHTML = `
                    <div>
                        <div>${group.groupTitle}</div>
                        <div class="text-[11px] font-normal text-slate-500 mt-0.5">${group.description}</div>
                    </div>
                    <span id="icon-${group.id}" class="text-slate-400 text-xs font-bold transition-transform duration-200">▼</span>
                `;

                // Konten di dalam Accordion
                const contentDiv = document.createElement('div');
                contentDiv.id = group.id;
                contentDiv.className = "hidden p-3 space-y-2 border-t border-slate-100 bg-slate-50/30";

                headerBtn.onclick = () => toggleAccordion(group.id, headerBtn);

                // Render item-item di dalam grup
                group.items.forEach(item => {
                    if (item.isSubGroup) {
                        const subDiv = document.createElement('div');
                        subDiv.className = "bg-white border border-slate-200 rounded-lg p-2.5 space-y-1.5";
                        subDiv.innerHTML = `
                            <div class="text-xs font-bold text-indigo-600 px-1 py-0.5">📂 ${item.title}</div>
                            <div class="space-y-1 pl-2 border-l-2 border-indigo-100"></div>
                        `;
                        const subContainer = subDiv.querySelector('.space-y-1');
                        
                        item.items.forEach(subItem => {
                            subContainer.appendChild(createQuizButton(subItem));
                        });
                        contentDiv.appendChild(subDiv);
                    } else {
                        contentDiv.appendChild(createQuizButton(item));
                    }
                });

                groupDiv.appendChild(headerBtn);
                groupDiv.appendChild(contentDiv);
                container.appendChild(groupDiv);
            });
        }

        function toggleAccordion(id, btn) {
            const content = document.getElementById(id);
            const icon = btn.querySelector('span[id^="icon-"]');
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
                btn.classList.add('bg-indigo-50/40');
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
                btn.classList.remove('bg-indigo-50/40');
            }
        }

        function createQuizButton(item) {
            const btn = document.createElement('button');
            const badgeText = item.sampleSize === "all" ? "Semua Soal" : "50 Soal Acak";
            const badgeClass = item.sampleSize === "all" ? "bg-emerald-50 text-emerald-600" : "bg-indigo-50 text-indigo-600";
            
            btn.className = "w-full p-2.5 bg-white border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/30 rounded-lg font-medium text-slate-700 text-left transition duration-200 flex justify-between items-center shadow-2xs text-xs";
            btn.innerHTML = `<span>${item.title}</span> <span class="${badgeClass} px-2 py-0.5 rounded-md text-[10px] font-semibold">${badgeText}</span>`;
            btn.onclick = () => muatDanMulaiQuiz(item.file, item.title, item.mode, item.sampleSize);
            return btn;
        }

        function muatDanMulaiQuiz(filePath, title, mode, sampleSize) {
            currentCategoryTitle = title;
            currentMode = mode;

            fetch(filePath)
                .then(response => {
                    if (!response.ok) throw new Error("Gagal memuat file soal.");
                    return response.json();
                })
                .then(data => {
                    rawVocab = data;
                    let shuffledAll = shuffleArray([...rawVocab]);
                    
                    if (sampleSize === "all") {
                        questions = shuffledAll;
                    } else {
                        questions = shuffledAll.slice(0, sampleSize);
                    }

                    currentIndex = 0;
                    score = 0;
                    
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.add('hidden');
                    document.getElementById('quiz-screen').classList.remove('hidden');
                    document.getElementById('score-badge').classList.remove('hidden');
                    document.getElementById('header-title').innerText = title;
                    document.getElementById('header-subtitle').innerText = `Latihan Mandiri (${questions.length} Soal)`;
                    
                    loadQuestion();
                })
                .catch(error => {
                    alert("Terjadi kesalahan saat memuat file JSON: " + error.message);
                });
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function loadQuestion() {
            isAnswered = false;
            clearInterval(timer);
            timeLeft = 30;
            document.getElementById('time-left').innerText = timeLeft;
            document.getElementById('next-btn').classList.add('hidden');
            
            document.getElementById('question-progress').innerText = `Soal ${currentIndex + 1} dari ${questions.length}`;
            let progressPercent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('current-score').innerText = score;

            const currentItem = questions[currentIndex];
            let questionType = 0;
            let questionText = "";
            let questionLabelText = "";
            let correctAnswer = "";
            let optionPoolKey = "";

            if (currentMode === 'vocab') {
                questionType = Math.floor(Math.random() * 2);
                if (questionType === 0) {
                    questionLabelText = "Pilih Arti Bahasa Indonesia yang Tepat";
                    questionText = currentItem.hiragana;
                    correctAnswer = currentItem.arti;
                    optionPoolKey = "arti";
                } else {
                    questionLabelText = "Pilih Hiragana yang Tepat";
                    questionText = currentItem.arti;
                    correctAnswer = currentItem.hiragana;
                    optionPoolKey = "hiragana";
                }
            } else {
                questionType = Math.floor(Math.random() * 3);
                if (questionType === 0) {
                    questionLabelText = "Pilih Cara Baca Hiragana yang Tepat";
                    questionText = currentItem.kanji;
                    correctAnswer = currentItem.hiragana;
                    optionPoolKey = "hiragana";
                } else if (questionType === 1) {
                    questionLabelText = "Pilih Kanji yang Tepat";
                    questionText = currentItem.hiragana;
                    correctAnswer = currentItem.kanji;
                    optionPoolKey = "kanji";
                } else {
                    questionLabelText = "Pilih Arti Bahasa Indonesia yang Tepat";
                    questionText = currentItem.kanji;
                    correctAnswer = currentItem.arti;
                    optionPoolKey = "arti";
                }
            }

            document.getElementById('question-label').innerText = questionLabelText;
            document.getElementById('question-text').innerText = questionText;

            let wrongOptions = rawVocab
                .filter(item => item[optionPoolKey] !== correctAnswer)
                .map(item => item[optionPoolKey]);
            
            wrongOptions = shuffleArray(wrongOptions);
            let options = [correctAnswer, wrongOptions[0], wrongOptions[1], wrongOptions[2]];
            options = shuffleArray(options);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(opt => {
                const button = document.createElement('button');
                button.className = "w-full p-4 text-left font-medium bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hover:border-indigo-300 transition duration-150 text-slate-700 flex justify-between items-center";
                button.innerHTML = `<span>${opt}</span>`;
                button.onclick = () => selectAnswer(button, opt, correctAnswer);
                optionsContainer.appendChild(button);
            });

            tampilkanTimer();
        }

        function tampilkanTimer() {
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            if (isAnswered) return;
            isAnswered = true;
            
            const buttons = document.getElementById('options-container').children;
            const qText = document.getElementById('question-text').innerText;
            const qLabel = document.getElementById('question-label').innerText;
            let correctVal = "";

            const found = rawVocab.find(i => {
                if (currentMode === 'vocab') {
                    return i.hiragana === qText || i.arti === qText;
                } else {
                    return i.kanji === qText || i.hiragana === qText;
                }
            });

            if (found) {
                if (currentMode === 'vocab') {
                    correctVal = qLabel.includes("Arti") ? found.arti : found.hiragana;
                } else {
                    if (qLabel.includes("Hiragana")) correctVal = found.hiragana;
                    else if (qLabel.includes("Kanji")) correctVal = found.kanji;
                    else correctVal = found.arti;
                }
            }

            for (let btn of buttons) {
                btn.disabled = true;
                if (btn.querySelector('span').innerText === correctVal) {
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
                } else {
                    btn.classList.add('opacity-50');
                }
            }
            showNextButton();
        }

        function selectAnswer(selectedButton, selectedOption, correctAnswer) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timer);

            const buttons = document.getElementById('options-container').children;

            if (selectedOption === correctAnswer) {
                score += 10;
                selectedButton.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700', 'font-semibold');
                document.getElementById('current-score').innerText = score;
            } else {
                selectedButton.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-700');
                for (let btn of buttons) {
                    if (btn.querySelector('span').innerText === correctAnswer) {
                        btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
                    }
                }
            }

            for (let btn of buttons) {
                btn.disabled = true;
                if (btn !== selectedButton && btn.querySelector('span').innerText !== correctAnswer) {
                    btn.classList.add('opacity-50');
                }
            }
            showNextButton();
        }

        function showNextButton() {
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            if (currentIndex === questions.length - 1) {
                nextBtn.innerText = "Lihat Hasil Akhir";
            } else {
                nextBtn.innerText = "Soal Selanjutnya";
            }
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('score-badge').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('result-user-info').innerText = `Kategori: ${currentCategoryTitle}`;
            document.getElementById('final-score').innerText = `Skor Akhir: ${score}`;
        }

        // Fungsi Tombol Beranda & Konfirmasi Keluar
        function confirmExit() {
            let konfirmasi = confirm("Yakin ingin keluar? Progres kuis saat ini akan hilang.");
            if (konfirmasi) {
                backToHome();
            }
        }

        function backToHome() {
            clearInterval(timer); // Hentikan timer kalau lagi jalan
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('score-badge').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('header-title').innerText = "Pusat Kuis Interaktif";
            document.getElementById('header-subtitle').innerText = "Pilih kategori latihan soal yang tersedia";
        }
    </script>
</body>
</html>
